<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4c896"/>
      <stop offset="100%" stop-color="#d49a6a"/>
    </linearGradient>
    <linearGradient id="headband" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b1a"/>
      <stop offset="100%" stop-color="#c91500"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>

  <!-- glow background -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- neck -->
  <rect x="80" y="135" width="40" height="25" fill="url(#skin)" stroke="#000" stroke-width="2.5"/>

  <!-- shoulders / shirt -->
  <path d="M 40 195 Q 50 155 80 150 L 120 150 Q 150 155 160 195 Z" fill="url(#shirt)" stroke="#000" stroke-width="3"/>
  <!-- shirt highlight -->
  <path d="M 100 152 L 100 195" stroke="#ff3b1a" stroke-width="3"/>

  <!-- head -->
  <ellipse cx="100" cy="95" rx="45" ry="52" fill="url(#skin)" stroke="#000" stroke-width="3"/>

  <!-- hair sides -->
  <path d="M 55 80 Q 50 50 70 45 L 80 55 Q 65 65 60 90 Z" fill="#2a1810" stroke="#000" stroke-width="2.5"/>
  <path d="M 145 80 Q 150 50 130 45 L 120 55 Q 135 65 140 90 Z" fill="#2a1810" stroke="#000" stroke-width="2.5"/>

  <!-- headband -->
  <rect x="55" y="62" width="90" height="14" fill="url(#headband)" stroke="#000" stroke-width="2.5"/>
  <!-- headband knot tails -->
  <path d="M 55 69 L 40 60 L 45 75 Z" fill="url(#headband)" stroke="#000" stroke-width="2"/>
  <path d="M 55 69 L 38 78 L 48 82 Z" fill="url(#headband)" stroke="#000" stroke-width="2"/>
  <!-- star on headband -->
  <polygon points="100,64 102,70 108,70 103,74 105,80 100,76 95,80 97,74 92,70 98,70" fill="#ffd700" stroke="#000" stroke-width="1"/>

  <!-- eyebrows -->
  <path d="M 70 88 Q 78 84 86 88" stroke="#2a1810" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 114 88 Q 122 84 130 88" stroke="#2a1810" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="78" cy="97" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="122" cy="97" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="79" cy="98" r="2.5" fill="#000"/>
  <circle cx="123" cy="98" r="2.5" fill="#000"/>
  <circle cx="80" cy="97" r="0.8" fill="#fff"/>
  <circle cx="124" cy="97" r="0.8" fill="#fff"/>

  <!-- nose -->
  <path d="M 100 100 Q 96 112 100 118 Q 104 118 104 116" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- mustache -->
  <path d="M 80 125 Q 90 122 100 125 Q 110 122 120 125 Q 115 132 100 130 Q 85 132 80 125 Z" fill="#2a1810" stroke="#000" stroke-width="2"/>

  <!-- smile -->
  <path d="M 88 135 Q 100 142 112 135" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- cheek blush -->
  <ellipse cx="65" cy="115" rx="6" ry="4" fill="#ff6b6b" opacity="0.5"/>
  <ellipse cx="135" cy="115" rx="6" ry="4" fill="#ff6b6b" opacity="0.5"/>
</svg>
